name: Reproducible Build

# Verifies the build is reproducible, not just configured to be (#161).
#
# Directory.Build.props sets Deterministic and (when CI=true) ContinuousIntegrationBuild,
# which are the INPUTS to a reproducible build. This workflow checks the OUTPUT: on each
# runner OS it builds the same commit twice from two different directories, hashes every
# DLL and PDB each src project produces, and fails when the two sets differ.
#
# It also compares Linux against Windows: the hashes of the first build on each OS are uploaded
# and the `cross-os` job fails when they differ. Two inputs used to differ between the operating
# systems and are now removed: the SDK wrote obj/*.AssemblyInfo.cs and obj/*.AssemblyAttributes.cs
# with the OS newline (the PDB records their hashes), and the .NET Framework targets compiled
# against the machine's targeting pack on Windows but the NuGet reference-assembly package on Linux.
# Directory.Build.targets normalises the generated sources to LF and Directory.Build.props pins the
# package. See REPRODUCIBLE-BUILD.md.
#
# NuGet packages are compared by their ENTRIES, never as files: a .nupkg is a zip and NuGet stamps
# every entry with its pack time, so two packs of one commit never match byte for byte. Each leg
# packs both trees and fails when an entry's name or content differs. The .psmdcp entry's file
# name is random on some NuGet versions, so it is compared under a fixed key.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    name: Build twice on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The second build runs from a worktree of the same commit at a different path, so a path
      # that leaks into the output shows up as a hash difference.
      - name: Build twice from different directories
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          build_and_hash() {
            local root="$1" out="$2"
            : > "$out"
            while IFS= read -r proj; do
              local name
              name="$(basename "$(dirname "$proj")")"
              dotnet build "$root/$proj" -c Release --nologo -v:q -p:ContinuousIntegrationBuild=true
              (cd "$root/$(dirname "$proj")/bin/Release" && find . -type f \( -name '*.dll' -o -name '*.pdb' \) -exec sha256sum {} +) \
                | sed -E "s#^([0-9a-f]+) [ *]\./#\1  ${name}/#" >> "$out"
            done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')
            LC_ALL=C sort -k2 -o "$out" "$out"
            test -s "$out"
          }

          # A worktree (not a plain copy) so the second build still sees the same commit and
          # remote, which the PDB's SourceLink map and the informational version embed.
          second="$RUNNER_TEMP/second-build/checkout-copy"
          git worktree add --detach "$second" HEAD

          build_and_hash "$PWD" "$RUNNER_TEMP/first.txt"
          build_and_hash "$second" "$RUNNER_TEMP/second.txt"

          cat "$RUNNER_TEMP/first.txt"
          if diff -u "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"; then
            echo "Two builds from different directories are byte-identical ($(wc -l < "$RUNNER_TEMP/first.txt") files)."
          else
            echo "::error::Build output is not reproducible on ${{ matrix.os }} (diff above)."
            exit 1
          fi

      # Packs the two builds above (--no-build) and compares the packages entry by entry.
      # RepositoryBranch is passed explicitly because the nuspec records the checked-out
      # branch and the second tree is a detached worktree; both packs get the ref under test.
      - name: Compare package entries
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          # The first interpreter that actually runs: on Windows `python3` can be the Store alias stub.
          py=""
          for candidate in python3 python; do
            if command -v "$candidate" > /dev/null && "$candidate" -c "import zipfile" 2> /dev/null; then py="$candidate"; break; fi
          done
          test -n "$py"
          second="$RUNNER_TEMP/second-build/checkout-copy"
          pack_and_list() {
            local root="$1" out="$2" dir="$3"
            mkdir -p "$dir"
            while IFS= read -r proj; do
              dotnet pack "$root/$proj" -c Release --no-build --nologo -v:q -p:ContinuousIntegrationBuild=true -p:RepositoryBranch="$GITHUB_REF" -o "$dir"
            done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')
            "$py" - "$dir" > "$out" <<'PY'
          import hashlib, pathlib, sys, zipfile
          for pkg in sorted(pathlib.Path(sys.argv[1]).glob('*.nupkg')):
              with zipfile.ZipFile(pkg) as z:
                  for name in sorted(z.namelist()):
                      key = 'package/services/metadata/core-properties/<id>.psmdcp' if name.endswith('.psmdcp') else name
                      print(hashlib.sha256(z.read(name)).hexdigest(), f'{pkg.name}!{key}')
          PY
            test -s "$out"
          }

          pack_and_list "$PWD" "$RUNNER_TEMP/first-packages.txt" "$RUNNER_TEMP/packages-first"
          pack_and_list "$second" "$RUNNER_TEMP/second-packages.txt" "$RUNNER_TEMP/packages-second"

          cat "$RUNNER_TEMP/first-packages.txt"
          if diff -u "$RUNNER_TEMP/first-packages.txt" "$RUNNER_TEMP/second-packages.txt"; then
            echo "Two packs from different directories have identical entries ($(wc -l < "$RUNNER_TEMP/first-packages.txt") entries)."
          else
            echo "::error::Package entries are not reproducible on ${{ matrix.os }} (diff above)."
            exit 1
          fi

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: ${{ runner.temp }}/first.txt
          if-no-files-found: error

      # The built files themselves, so a cross-OS mismatch can be diagnosed byte by byte
      # (diff the PDB documents and the referenced-assembly records) instead of only seeing
      # that two digests differ.
      - name: Upload built assemblies
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: output-${{ matrix.os }}
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.pdb
          retention-days: 7
          if-no-files-found: ignore

  cross-os:
    name: Compare Linux and Windows output
    needs: reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: hashes-*
          path: hashes

      - name: Fail when the operating systems differ
        shell: bash
        run: |
          set -euo pipefail
          if diff -u hashes/hashes-ubuntu-latest/first.txt hashes/hashes-windows-latest/first.txt; then
            echo "Linux and Windows builds are byte-identical ($(wc -l < hashes/hashes-ubuntu-latest/first.txt) files)."
          else
            echo "::error::Assemblies or symbols differ between ubuntu-latest and windows-latest (diff above). Download the output-* artifacts and compare the PDB documents and referenced-assembly records."
            exit 1
          fi
